[package]
name = "memos-autotagger"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
